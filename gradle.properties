# ─── Encoding / Locale ────────────────────────────────────────────────────────
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.language=en
systemProp.user.country=US

# ─── AndroidX ─────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# ─── Build features (disable unused ones to speed up resource processing) ──────
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.resvalues=false

# ─── Gradle JVM memory ────────────────────────────────────────────────────────
# CRITICAL FIX: The original -Xmx8192m was trying to reserve 8 GB on a phone.
# The Kotlin daemon spawned a SECOND JVM that also needed memory → OOM → daemon
# connection failure. Use a modest heap that fits in device RAM.
org.gradle.jvmargs=-Xmx768m -Xms256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ─── Kotlin compiler — run IN-PROCESS instead of a daemon ────────────────────
# This is the primary fix for "Could not connect to Kotlin compile daemon".
# In-process means Kotlin compiles inside the existing Gradle JVM instead of
# spawning a separate daemon process. One JVM, half the memory pressure.
kotlin.compiler.execution.strategy=in-process

# ─── Kotlin daemon JVM args (fallback — used if daemon mode is ever re-enabled)
kotlin.daemon.jvm.options=-Xmx512m -Xms128m

# ─── kapt ─────────────────────────────────────────────────────────────────────
# Run annotation processing in the same process as compilation (no extra fork).
kapt.use.worker.api=false
kapt.incremental.apt=false
# Don't scan the entire compile classpath for annotation processors — speeds up
# kapt and avoids false-positive processor discovery warnings.
kapt.include.compile.classpath=false

# ─── Gradle daemon ────────────────────────────────────────────────────────────
# Keep the daemon alive between builds for speed, but cap its idle timeout low
# so it doesn't consume RAM when you're not building.
org.gradle.daemon=true
org.gradle.daemon.idletimeout=120000

# ─── Parallelism ──────────────────────────────────────────────────────────────
# Parallel project configuration is fine; parallel task execution off by default
# on low-RAM devices (can cause OOM when tasks all read large files at once).
org.gradle.configureondemand=false
org.gradle.parallel=false

# ─── Build cache ──────────────────────────────────────────────────────────────
org.gradle.caching=true

# ─── Room ─────────────────────────────────────────────────────────────────────
room.schemaLocation=schemas
room.incremental=true
room.expandProjection=true

# ─── Kotlin code style ────────────────────────────────────────────────────────
kotlin.code.style=official
