plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.kapt'
}

// Task 1: Load secrets from local.properties (git-ignored)
// Uses rootDir (always available) instead of rootProject.file() which can be null in AndroidIDE
def localProps = new Properties()
try {
    def localPropsFile = new File(rootDir, 'local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { stream -> localProps.load(stream) }
    }
} catch (Exception e) {
    logger.warn("Could not load local.properties: ${e.message}")
}

android {
    namespace 'com.novelverse.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.novelverse.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SUPABASE_URL",         "\"${localProps.getProperty('SUPABASE_URL', 'https://ztfvifgtebptxfoasrae.supabase.co')}\""
        buildConfigField "String", "SUPABASE_ANON_KEY",    "\"${localProps.getProperty('SUPABASE_ANON_KEY', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0ZnZpZmd0ZWJwdHhmb2FzcmFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NTk2MTcsImV4cCI6MjA4OTMzNTYxN30.kQpVSwPCK3vc4Xx2-ov3F9fnOkStadzAzJVk4Lxq6F0')}\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${localProps.getProperty('GOOGLE_WEB_CLIENT_ID', 'http://1029537581769-r4u4kp674itr4nlh158octq8fhben3on.apps.googleusercontent.com')}\""
    }

    signingConfigs {
        debug {
            // Default debug signing — used automatically by Gradle
        }
        release {
            // Load keystore credentials from local.properties (never commit these to git)
            storeFile     localProps.getProperty('KEYSTORE_PATH')      ? file(localProps.getProperty('KEYSTORE_PATH'))      : null
            storePassword localProps.getProperty('KEYSTORE_PASSWORD')  ?: ''
            keyAlias      localProps.getProperty('KEY_ALIAS')          ?: ''
            keyPassword   localProps.getProperty('KEY_PASSWORD')       ?: ''
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Uses release keystore if KEYSTORE_PATH is set in local.properties;
            // falls back to debug signing so unsigned-release builds still compile locally.
            signingConfig signingConfigs.release.storeFile != null
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    // Room - _Impl files are hand-generated; room-compiler kapt is NOT used (incompatible with aarch64/AndroidIDE)
    implementation "androidx.room:room-runtime:2.5.2"
    implementation "androidx.room:room-ktx:2.5.2"
    implementation "androidx.room:room-paging:2.5.2"

    // Paging
    implementation "androidx.paging:paging-runtime-ktx:3.1.1"
    implementation "androidx.paging:paging-rxjava3:3.1.1"

    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Architecture Components
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

